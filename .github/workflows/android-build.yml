# Builds the Android app on a GitHub Linux runner, with unit tests and lint:
#   PocketWebcam-android-aab  -> app-release.aab, the file Google Play wants
#   PocketWebcam-android-apk  -> app-release.apk (signed) or app-release-unsigned.apk + app-debug.apk
# Download the latest one:
#   gh run download -R Joorg04/pocketwebcam -n PocketWebcam-android-apk
# Release builds are signed with the upload key only when these repository secrets exist
# (set them under Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the release builds are unsigned and a debug APK is added for installing.
name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE secret: release builds stay unsigned."
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          # Read by android/app/build.gradle.kts like the properties in ~/.gradle/gradle.properties.
          echo "ORG_GRADLE_PROJECT_POCKETWEBCAM_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build, test and lint
        env:
          ORG_GRADLE_PROJECT_POCKETWEBCAM_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_POCKETWEBCAM_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_POCKETWEBCAM_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tasks=":app:bundleRelease :app:assembleRelease"
          if [ "$SIGNED" != "true" ]; then tasks="$tasks :app:assembleDebug"; fi
          ./gradlew --no-daemon $tasks lint test

      - name: Upload the App Bundle
        uses: actions/upload-artifact@v4
        continue-on-error: true  # a full artifact quota shouldn't fail the build
        with:
          name: PocketWebcam-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        continue-on-error: true  # a full artifact quota shouldn't fail the build
        with:
          name: PocketWebcam-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true  # a full artifact quota shouldn't fail the build
        with:
          name: PocketWebcam-android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

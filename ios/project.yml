# XcodeGen spec. On the Mac:  brew install xcodegen && cd ios && xcodegen
# This generates PocketWebcam.xcodeproj; never edit the .xcodeproj by hand.
name: PocketWebcam
options:
  bundleIdPrefix: com.pocketwebcam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Apple Developer Team ID (individual account). CI signs manually; see docs/IOS_SIGNING.md.
    DEVELOPMENT_TEAM: 3Q86L64LTN
    CODE_SIGN_STYLE: Automatic

targets:
  PocketWebcam:
    type: application
    platform: iOS
    sources:
      - path: PocketWebcam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketwebcam.ios
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only for v1 (no iPad screenshots/review needed)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: PocketWebcam/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pocket Webcam
        # Without these, XcodeGen writes its defaults (1.0 / 1) instead of the settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arm64, video-camera]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSCameraUsageDescription: >-
          Pocket Webcam streams your camera to your computer so you can use it as a webcam.
        NSMicrophoneUsageDescription: >-
          Pocket Webcam sends your microphone to your computer while it's connected, so you can use the phone as a microphone in calls. You can turn it off with the mic button.
        NSLocalNetworkUsageDescription: >-
          Pocket Webcam uses your local network so your computer can find this phone and receive its video.
        NSBonjourServices:
          - _pocketwebcam._tcp
        # Pairing links: scanning the computer's code with the iPhone's Camera app opens the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.pocketwebcam.pair
            CFBundleURLSchemes: [pocketwebcam]
        # Only the system's own TLS (Network.framework) and CryptoKit hashes/HMAC: exempt
        # from export-compliance paperwork.
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - PocketWebcamTests

  PocketWebcamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketWebcamTests
      - path: ../protocol-fixtures/pairing.json
        buildPhase: resources
    dependencies:
      - target: PocketWebcam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketwebcam.ios.tests

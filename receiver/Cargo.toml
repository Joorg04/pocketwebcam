[workspace]
# wincam is the Windows virtual camera DLL; Linux builds skip it.
members = [".", "wincam"]
default-members = ["."]

[package]
name = "pocketwebcam-receiver"
version = "0.2.0"
edition = "2021"
description = "Desktop receiver for Pocket Webcam: turns a phone camera into a virtual webcam"
license = "MIT"
publish = false
default-run = "pocketwebcam"

[features]
default = ["gui", "background"]
# The desktop window. Build the terminal-only receiver with `--no-default-features`.
gui = ["dep:eframe", "dep:image", "dep:ksni", "dep:raw-window-handle", "dep:rfd", "dep:tray-icon"]
# Background blur / virtual background (on-device person segmentation with tract).
background = ["dep:tract-onnx", "dep:image"]

[lib]
name = "pocketwebcam_receiver"
path = "src/lib.rs"

[[bin]]
name = "pocketwebcam"
path = "src/main.rs"

[[bin]]
name = "pocketwebcam-app"
path = "src/bin/app/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.2", optional = true }
env_logger = "0.11"
gstreamer = "0.23"
gstreamer-app = "0.23"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
log = "0.4"
mdns-sd = "0.13"
qrcode = { version = "0.14", default-features = false }
# xdg-desktop-portal file dialog, no GTK.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tract-onnx = { version = "0.23.9", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
base64 = "0.22"

# Linux tray (StatusNotifierItem).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }
# The window's HWND, to show and hide it from the tray (eframe pauses while hidden).
raw-window-handle = { version = "0.6.2", optional = true }
tray-icon = { version = "0.26.1", optional = true }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true

# cargo-about: which licenses the Rust dependencies may use. Used by
# scripts/third-party-notices.sh to write packaging/THIRD-PARTY-NOTICES.txt.
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0",
    "OFL-1.1", "Ubuntu-font-1.0", "0BSD", "Unlicense", "CDLA-Permissive-2.0", "bzip2-1.0.6", "OpenSSL",
]
# Our own crates (publish = false) are under the repo's LICENSE, not listed here.
private = { ignore = true }
# Everything that ships: the Linux and Windows builds.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

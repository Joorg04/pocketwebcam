# Pocket Webcam: the "Pocket Webcam Camera" virtual webcam at /dev/video10.
# exclusive_caps=1 is required for Chrome/WebRTC to list the device as a camera.
# To change these, copy this file to /etc/modprobe.d/pocketwebcam.conf and edit the copy.
options v4l2loopback devices=1 video_nr=10 card_label="Pocket Webcam Camera" exclusive_caps=1

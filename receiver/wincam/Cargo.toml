[package]
name = "pocketwebcam-camera"
version = "0.1.0"
edition = "2021"
description = "Windows 11 virtual camera for Pocket Webcam: a Media Foundation media source that shows the app's video"
license = "MIT"
publish = false

[lib]
name = "pocketwebcam_camera"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
] }
windows-core = "0.62.2"
